name: build

on:
  push:
    branches:
      # main is the trunk of Nazarick-agent — the shipping line, the branch v0.01 was
      # tagged from. master is the frozen upstream donor (2.5.5-pure.3) that we port
      # from deliberately rather than merge, so it is no longer gated.
      - main
      - 'feat/**'
      # Maintenance branches (CI tweaks, dependency bumps, docs) build too — they
      # are still code that will be merged, so they deserve the same gate.
      - 'chore/**'
      # Bug-fix branches build on push too: same gate as feat/**, so a PR into
      # moxw or main has a green signal before the PR event itself fires.
      - 'fix/**'
      # Moxw Agent is a long-lived product branch (not a feature to merge back),
      # but it is still code: every push runs the same gate.
      - 'moxw'
    # Doc-only pushes (README, notes, licence) do not need a 13-20 min assemble
    # run: no source, resource or build file changes are involved. A push is
    # skipped only when *every* changed path matches; mixing docs with code still
    # triggers CI. Add `[skip ci]` to the commit message for one-off skips.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
      # PRs into the Moxw product branch are gated too: it ships its own flavour,
      # so a breakage there is a release breakage, not a trunk-only concern.
      - 'moxw'
    # Same rule for PRs: a docs-only PR stays mergeable without burning a run.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: assemble ${{ matrix.flavor }} + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # This branch ships one flavour. The matrix shape is kept so the step and
    # artifact names below stay flavour-parameterised.
    strategy:
      fail-fast: false
      matrix:
        flavor: [moxw]
    # Include the flavor: both matrix jobs share this workflow ref, and a shared
    # group with cancel-in-progress would let the second job cancel the first.
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.flavor }}
      cancel-in-progress: true
    # NDK >= r23 reads this and, when ccache is on PATH, routes the C/C++
    # toolchain through it. llama.cpp (a submodule, thousands of translation
    # units x arm64-v8a + x86_64) is by far the longest pole, so a warm ccache
    # turns a full native compile into a near-noop.
    env:
      ANDROID_USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android v3 defaults to `sdkmanager tools`, a package that no longer
      # exists in the SDK repository (exit 1). Pin the list explicitly.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      # NOTE: do *not* cache $ANDROID_HOME/ndk. The runner image already ships
      # the NDKs, AGP never downloads one on this project, and the archive is
      # ~2 GB — saving it alone cost ~7 minutes while restoring it merely
      # overwrote files that were already on disk.
      - name: Install ccache
        run: |
          # ubuntu-latest does not ship ccache, so ANDROID_USE_CCACHE alone did
          # nothing. Install it before CMake configures the native toolchain.
          sudo apt-get install -y -qq ccache > /dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          }
          ccache --version | head -1

      # Scoped to the Vulkan experiment: installs the SPIRV-Headers CMake package
      # that ggml-vulkan's find_package demands but the NDK sysroot hides. Other
      # branches pay nothing. Remove this step when the engine branch merges.
      # The Vulkan-default engine is carried by branch lineage, so this used to be an
      # allowlist of branch names - which turned every new branch into a manual edit and
      # sprang once already (fix/prompt-fits-context configure-failed on
      # find_package(SPIRV-Headers) with this step skipped). Test the prefix instead,
      # matching the push triggers above: any feat/** or fix/** carries the engine.
      - name: Install SPIRV-Headers (Vulkan shader dependency)
        if: startsWith(github.ref_name, 'feat/') || startsWith(github.ref_name, 'fix/')
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers "$RUNNER_TEMP/spirv-headers"
          cmake -S "$RUNNER_TEMP/spirv-headers" -B "$RUNNER_TEMP/sv-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sv"
          cmake --install "$RUNNER_TEMP/sv-build"
          echo "SPIRV_HEADERS_PREFIX=$RUNNER_TEMP/sv" >> "$GITHUB_ENV"
          # glslc compiles ggml's compute shaders at build time; FindVulkan can't see
          # the runner's copy through the NDK toolchain, so name it explicitly.
          GLSLC_BIN="$(command -v glslc || true)"
          if [ -z "$GLSLC_BIN" ]; then
            GLSLC_BIN="$(find "$ANDROID_HOME/ndk" -type f -name glslc 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$GLSLC_BIN" ]; then
            sudo apt-get update -qq && sudo apt-get install -y glslang-tools
            GLSLC_BIN="$(command -v glslc || true)"
          fi
          echo "GLSLC=$GLSLC_BIN" | tee -a "$GITHUB_ENV"
          [ -x "$GLSLC_BIN" ] || { echo "no glslc found; candidates:"; find "$ANDROID_HOME" /usr -name 'glslc*' -o -name 'glslangValidator*' 2>/dev/null | head -20; exit 1; }

      - name: Cache ccache (native build)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ hashFiles('llama-cpp/native/llama.cpp/**', 'llama-cpp/src/main/cpp/**', 'workspace/src/main/cpp/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # web/build.gradle.kts:installWebUiDeps downloads the web-ui dependency
      # tree with bun; the vite buildWebUi task depends on it.
      - name: Cache web-ui node_modules
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: webui-${{ runner.os }}-${{ hashFiles('web-ui/bun.lock', 'web-ui/pnpm-lock.yaml') }}
          restore-keys: |
            webui-${{ runner.os }}-

      - name: Android SDK inventory
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | timeout 180 sdkmanager --licenses > /dev/null 2>&1 || true
          for d in platforms build-tools ndk cmake; do
            echo "--- $d"
            ls "$ANDROID_HOME/$d" 2>/dev/null || echo "(none)"
          done

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain versions
        run: |
          java -version
          bun --version
          pnpm --version
          echo "--- ccache ---"
          which ccache && ccache --version && ccache -s || echo "ccache NOT installed"

      # web-ui/bun.lock is not committed upstream (only pnpm-lock.yaml is), while
      # web/build.gradle.kts:installWebUiDeps runs `bun install --frozen-lockfile`.
      # Bootstrap it the same way a local checkout does: bun migrates the pins.
      - name: Bootstrap web-ui lockfile
        working-directory: web-ui
        run: |
          if [ -f bun.lock ]; then
            echo "bun.lock present"
          else
            echo "bun.lock missing -> generating from pnpm-lock.yaml pins"
            bun install
          fi

      # Release signing. The keystore is a base64 Actions secret rather than a file in
      # the tree, so nothing secret gets committed and a fork with no secrets still
      # builds (unsigned, by design -- hence the early exit instead of a failure).
      # Decoding it here and exporting NAZARICK_* is all app/build.gradle.kts needs to
      # sign the release variant itself.
      - name: Provision release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.NAZARICK_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NAZARICK_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NAZARICK_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::notice::No keystore secret configured - release variant ships unsigned"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/nazarick-release.p12"
          echo "keystore: $(wc -c < "$RUNNER_TEMP/nazarick-release.p12") bytes, sha256 $(sha256sum "$RUNNER_TEMP/nazarick-release.p12" | cut -d' ' -f1 | cut -c1-16)"
          {
            echo "NAZARICK_KEYSTORE=$RUNNER_TEMP/nazarick-release.p12"
            echo "NAZARICK_STORE_PASSWORD=${STORE_PASSWORD}"
            echo "NAZARICK_KEY_PASSWORD=${KEY_PASSWORD}"
            echo "NAZARICK_KEY_ALIAS=nazarick"
          } >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"

      # Single Gradle invocation: one daemon, one configuration phase. Build the
      # shipping variant of the matrix flavor (R8 + optimized resource shrinking,
      # keep rules in src/main/keepRules) and run the JVM unit tests against that
      # same variant. The old debug build is gone on purpose: it compiled every
      # library subproject a second time and rebuilt the llama.cpp native libs a
      # second time, for an artifact nothing shipped.
      #
      # The published APK used to be `app-<flavor>-release-unsigned.apk`, finished off
      # by a re-sign on the VPS (dl2.sh apk-moxw, p2.keystore). Since 2026-10-31 the
      # workflow signs with our own key (step above), so the artifact IS the release.
      # If anyone still runs that VPS pass it will REPLACE our seal with p2's, and
      # upgrades then require p2's key forever -- stop running it, or do it on purpose.
      #
      # :ai:testDebugUnitTest is listed explicitly: the app's own unit-test task
      # does not run the library modules' tests, so the provider request-shape
      # tests in :ai never executed in CI. They are plain JVM tests
      # (android.util.Log is stubbed via returnDefaultValues), so this is seconds.
      - name: Assemble ${{ matrix.flavor }} APK + unit tests
        env:
          # Fast lane: a push to a non-master branch (feat/**) skips the release
          # lint pass. master pushes and pull requests keep lintVital as the
          # release gate — see skipLintVital in app/build.gradle.kts.
          SKIP_LINT: ${{ github.event_name == 'push' && github.ref != 'refs/heads/master' }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          F="${FLAVOR^}"
          FLAGS=""
          if [ "$SKIP_LINT" = "true" ]; then
            echo "fast lane: -PskipLintVital"
            FLAGS="-PskipLintVital"
          fi
          # :llama-cpp, :ai and :runtime carry real JVM unit tests (the embedding vector maths,
          # the embedder's handle lifecycle, the cold-memory rules, the compaction planner, the
          # token estimator and every tool-result budget rule) that nothing else runs: module
          # tests are flavour-independent and are never reached through :app, so each module is
          # named explicitly. :runtime was extracted in P4 with 19 test files and had been
          # missing from this list since, which left the harness's pure logic ungated.
          # DIAG BRANCH ONLY (fix/embed-gpu-race, 2026-10-26): unit tests were cut from this
          # job's gradle line because the hosted runner took a shutdown signal at ~43 min
          # elapsed three runs running, every time in the packaging tail *after* a green
          # 10.5-minute test task; the native diff under diagnosis cannot break JVM tests.
          # Restored here (fix/prompt-fits-context), which re-opened that wound twice: runs
          # 42-1 and 42-2 were both cancelled by a runner shutdown, and the job log shows why -
          # :app:testMoxwReleaseUnitTest is 354 test classes and costs ~11.5 min, which pushes
          # the job from ~36 min (run 41, green) past the ceiling. The three module suites are
          # the ones that actually gate a JVM change (this branch's ContextPlannerTest lives in
          # :llama-cpp and finishes in ~5 s), so they stay here. The app's own suite is dropped
          # from the shipping job: `git grep` finds zero tests in app/src/test mentioning
          # ContextPlanner or ChatRequestMapper, so on a JVM-logic branch it is 11.5 minutes of
          # upstream coverage that cannot fail for this diff. It deserves its own job with
          # maxParallelForks, tracked as a follow-up rather than smuggled into this ticket.
          # (:sd-cpp added by AURA-014: its catalog/PNG/repair suites shipped with AURA-012 and
          # nothing ever ran them — an orphaned suite gates nothing.)
          ./gradlew ":app:assemble${F}Release" :ai:testDebugUnitTest :llama-cpp:testDebugUnitTest :runtime:testDebugUnitTest :sd-cpp:testDebugUnitTest $FLAGS --stacktrace

      - name: Show ${{ matrix.flavor }} APK sizes
        run: ls -la app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk || true

      # An artifact nobody can identify is a rumour. Print the signing certificate into
      # the run log so every release carries its own proof: the SHA-256 below must equal
      # the minted key's certificate digest (AURA-010, a26fbb04a3717785...aebda7d --
      # `python tools/mob/keystore_check.py` prints it from the .p12). On a fork with no
      # secrets the step is skipped rather than failed, matching the unsigned-but-green
      # promise of the provisioning step.
      - name: Verify release signature
        if: steps.keystore.outputs.present == 'true'
        run: |
          set -eu
          APK="$(ls app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk | head -n 1)"
          echo "artifact: $APK"
          AS="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          if [ -z "$AS" ]; then
            echo "::warning::apksigner not found under \$ANDROID_HOME/build-tools"
            exit 0
          fi
          "$AS" verify --print-certs "$APK"

      - name: Show ccache stats
        if: always()
        run: ccache -s -v || true

      - name: Upload ${{ matrix.flavor }} APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Play Store beta (owner directive, 2026-11-04): same code, same key, one
      # different identity — -PPLAY_BETA re-points the moxw flavor at
      # com.nazarick.agent.beta (app/build.gradle.kts) so the Play listing can
      # live beside direct installs on the same device. Runs AFTER the main APK
      # upload because it reuses (and first clears) the variant's output dir.
      # The AAB is the Play-native format (bundleMoxwRelease signs with the same
      # release key); the APK is uploaded so the exact beta bytes can be
      # installed and verified on the Fold before anyone uploads.
      - name: Assemble Play beta (com.nazarick.agent.beta)
        env:
          SKIP_LINT: ${{ github.event_name == 'push' && github.ref != 'refs/heads/master' }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -eu
          F="${FLAVOR^}"
          FLAGS=""
          if [ "$SKIP_LINT" = "true" ]; then
            echo "fast lane: -PskipLintVital"
            FLAGS="-PskipLintVital"
          fi
          rm -f app/build/outputs/apk/${FLAVOR}/release/*.apk
          ./gradlew ":app:assemble${F}Release" ":app:bundle${F}Release" -PPLAY_BETA $FLAGS --stacktrace

      - name: Verify Play beta signature
        if: steps.keystore.outputs.present == 'true'
        run: |
          set -eu
          APK="$(ls app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk | head -n 1)"
          echo "artifact: $APK"
          AS="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          if [ -z "$AS" ]; then
            echo "::warning::apksigner not found under \$ANDROID_HOME/build-tools"
            exit 0
          fi
          "$AS" verify --print-certs "$APK"

      - name: Upload Play beta APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-play-beta
          path: app/build/outputs/apk/${{ matrix.flavor }}/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play beta AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-play-beta
          path: app/build/outputs/bundle/${{ matrix.flavor }}Release/*.aab
          if-no-files-found: error
          retention-days: 14

      # diag branch only: a debuggable APK so `run-as` and debuggerd -b work on the
      # Fold for the stall hunt, and so Logcat shows unshrunk stack frames.
      - name: Upload ${{ matrix.flavor }} debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-debug
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

  # diag branch only: the debug APK gets its own short job. The shared assemble
  # job lost two runners to infra shutdown signals at 25-65 min with the debug
  # native build included; alone it should finish in one runner's attention span.
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ matrix.flavor }}
          path: |
            app/build/reports/tests/
            ai/build/reports/tests/
            runtime/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      # Room schema exports (app/schemas/**) are generated by KSP during compilation but live
      # in the source tree, so CI's copy never makes it back. Uploading them lets a version-bump
      # PR fetch the real N.json (identityHash included) instead of hand-rolling it.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas-${{ matrix.flavor }}
          path: app/schemas/
          if-no-files-found: ignore
          retention-days: 14

  debug:
    name: debug apk (diag)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.ref_name == 'feat/stall-diag' || github.ref_name == 'fix/embed-gpu-race'
    concurrency:
      group: debug-${{ github.ref }}
      cancel-in-progress: true
    env:
      ANDROID_USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install ccache
        run: |
          sudo apt-get install -y -qq ccache > /dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          }

      - name: Install SPIRV-Headers (Vulkan shader dependency)
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers "$RUNNER_TEMP/spirv-headers"
          cmake -S "$RUNNER_TEMP/spirv-headers" -B "$RUNNER_TEMP/sv-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sv"
          cmake --install "$RUNNER_TEMP/sv-build"
          echo "SPIRV_HEADERS_PREFIX=$RUNNER_TEMP/sv" >> "$GITHUB_ENV"
          GLSLC_BIN="$(command -v glslc || true)"
          if [ -z "$GLSLC_BIN" ]; then
            GLSLC_BIN="$(find "$ANDROID_HOME/ndk" -type f -name glslc 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$GLSLC_BIN" ]; then
            sudo apt-get update -qq && sudo apt-get install -y glslang-tools
            GLSLC_BIN="$(command -v glslc || true)"
          fi
          echo "GLSLC=$GLSLC_BIN" | tee -a "$GITHUB_ENV"
          [ -x "$GLSLC_BIN" ] || { echo "no glslc found; candidates:"; find "$ANDROID_HOME" /usr -name 'glslc*' -o -name 'glslangValidator*' 2>/dev/null | head -20; exit 1; }

      - name: Cache ccache (native build)
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ hashFiles('llama-cpp/native/llama.cpp/**', 'llama-cpp/src/main/cpp/**', 'workspace/src/main/cpp/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap web-ui lockfile
        working-directory: web-ui
        run: |
          if [ ! -f bun.lock ]; then bun install; fi

      - name: Assemble moxw debug APK
        run: ./gradlew :app:assembleMoxwDebug -PskipLintVital --stacktrace

      - name: Upload moxw debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-moxw-debug
          path: app/build/outputs/apk/moxw/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Show ccache stats
        if: always()
        run: ccache -s || true

  # AURA-014 — the "the app's own suite deserves its own job" follow-up build.yml has
  # promised since run 42. Scoped deliberately: the classes that gate the shipped seed
  # logic (GuardianSeedTest) and the Settings/Preferences-key persistence invariant
  # (SettingsPersistenceCoverageTest — it fails when a Settings field is added without
  # its key, exactly the trap that bit autoEnabledDefaultSkills). Compiling the test
  # source set is most of the cost either way; what the separate job buys is a wall of
  # its own, instead of pushing the shipping assemble job past the runner ceiling.
  # Widen the filter here toward the full suite over time.
  app-unit-tests:
    name: app unit tests (scoped)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: app-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # :web:buildWebUi shells out to pnpm (web/build.gradle.kts) — the assemble job
      # sets both bun and pnpm; a job that builds any :app variant needs pnpm too
      # (run 92: Cannot run program "pnpm" ... No such file or directory).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap web-ui lockfile
        working-directory: web-ui
        run: |
          if [ ! -f bun.lock ]; then bun install; fi

      # The release variant's signingConfigs block resolves storeFile eagerly at
      # configuration time (the "only consulted when hasReleaseSigning" comment in
      # app/build.gradle.kts holds only while the create() block runs with the env
      # present — run 91 proved a unit-test-only job without it dies on a bare NPE).
      # Same provisioning step the assemble job uses; testMoxwReleaseUnitTest builds
      # the release variant and therefore pays the same contract.
      - name: Provision release keystore
        env:
          KEYSTORE_B64: ${{ secrets.NAZARICK_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NAZARICK_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NAZARICK_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::notice::No keystore secret configured - release variant ships unsigned"
            exit 0
          fi
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/nazarick-release.p12"
          {
            echo "NAZARICK_KEYSTORE=$RUNNER_TEMP/nazarick-release.p12"
            echo "NAZARICK_STORE_PASSWORD=${STORE_PASSWORD}"
            echo "NAZARICK_KEY_PASSWORD=${KEY_PASSWORD}"
            echo "NAZARICK_KEY_ALIAS=nazarick"
          } >> "$GITHUB_ENV"

      - name: Run scoped app unit tests
        run: >
          ./gradlew :app:testMoxwReleaseUnitTest --stacktrace
          --tests "me.rerere.rikkahub.data.guardians.GuardianSeedTest"
          --tests "me.rerere.rikkahub.data.datastore.SettingsPersistenceCoverageTest"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-unit-test-report
